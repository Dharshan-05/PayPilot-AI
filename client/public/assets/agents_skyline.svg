<svg xmlns="http://www.w3.org/2000/svg" width="384" height="720" viewBox="0 0 96 180" fill="none">
  <defs>
    <linearGradient id="agRear" x1="48" y1="44" x2="48" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c9c1b5" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#b5ada0" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="agFront" x1="30" y1="90" x2="30" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5d574f" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#48433d" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <!-- Tall right setback tower -->
  <g>
    <rect x="64" y="45" width="16" height="8" fill="#c7bfb3" opacity="0.6"/>
    <rect x="57" y="53" width="31" height="127" fill="url(#agRear)"/>
    <!-- Right connected wing -->
    <rect x="70" y="110" width="26" height="70" fill="#bfb7aa" opacity="0.72"/>
    <g fill="#f8f2e8" opacity="0.55">
      <rect x="62" y="61" width="3" height="4"/>
      <rect x="69" y="61" width="3" height="4"/>
      <rect x="76" y="61" width="3" height="4"/>
      <rect x="62" y="70" width="3" height="4"/>
      <rect x="69" y="70" width="3" height="4"/>
      <rect x="76" y="70" width="3" height="4"/>
      <rect x="62" y="79" width="3" height="4"/>
      <rect x="69" y="79" width="3" height="4"/>
      <rect x="76" y="79" width="3" height="4"/>
    </g>
    <g fill="#6d665d" opacity="0.48">
      <rect x="74" y="121" width="4" height="3" rx="0.5"/>
