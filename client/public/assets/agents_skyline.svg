      <rect x="88" y="121" width="4" height="3" rx="0.5"/>
      <rect x="74" y="129" width="4" height="3" rx="0.5"/>
      <rect x="81" y="129" width="4" height="3" rx="0.5"/>
      <rect x="88" y="129" width="4" height="3" rx="0.5"/>
